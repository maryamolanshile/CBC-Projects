@charset "utf-8";

iconify-icon { min-width: 1em; min-height: 1em; display: block; }

.icon-container { display: inline-block; vertical-align: middle; box-sizing=
: content-box; line-height: 1em !important; }

.electron-nav { height: 38px; }

.mac-controls { width: 70px; }

.electron-nav .icon-button svg { margin-top: -2px; }

.masonry { list-style: none; column-gap: 1em; column-count: 1; }

@media (min-width: 640px) {
  .masonry { column-count: 2; }
}

@media (min-width: 768px) {
  .masonry { column-count: 3; }
}

@media (min-width: 1024px) {
  .masonry { column-count: 4; }
}

@media (min-width: 1280px) {
  .masonry { column-count: 5; }
}

