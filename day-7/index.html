<!doctype html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-rose-50 p-16 flex w-full gap-x-4">

    <div class="w-1/3 bg-white h-1/4 rounded-lg shadow p-4">
      <h2 class="font-bold text-2xl pb-4 text-orange-500">Your Cart (0)</h2>
      <!-- <img src="assets/images/illustration-empty-cart.svg" class="mx-auto" />
      <p class="text-sm">Your added items will appear here</p> -->
      <div id="cart-items">
        <!-- Cart items will be displayed here -->
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
