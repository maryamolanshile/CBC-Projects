<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Facebook_Interface</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            background-color: lightgray;
         }
        h1{
            color: blue;
            font-weight: 20px;
            font-size: 55px;
            margin-bottom: 0%;
        }
        .p1{
            font-size: 28px;
            margin-top: 0px;
            word-spacing: 2px; 
        }
        .right{
            margin-right: 50px;

        }
        #email, #password{
            margin-top: 6px;
            margin-right: 10px;
            margin-left: 10px;
            width: 300px;
            padding-top: 7px;
            padding-bottom: 7px;
            padding-left: 8px;
            font-size: 13px;
            border-color: rgba(192, 192, 192, 0.849);
            border-radius: 4px;
            border-width: 0.5px;
        }
        #email, #password:hover{
            border-color: blue;
            cursor: pointer;
        }
        .login{
            background-color: blue;
            width: 310px;
            padding-top: 8px;
            padding-bottom: 8px;
            border-radius: 3px;
            color: white;
            border: 1px solid blue;
            font-weight: 10px;
            font-size: 15px;
            margin-left: 10px;
            margin-right: 10px;
            margin-top: 0px;
            margin-bottom: 0px;
        
        }
        .fp{
            color: blue;
            width: 310px;
            padding-top: 6px;
            padding-bottom: 7px;
            border-radius: 3px;
            background-color: white;
            border: 1px solid rgba(255, 250, 250, 0.692);
            font-size: 13px;
            margin-left: 10px;
            margin-right: 10px;
        }
        .new{
            background-color: green;
            width: 160px;
            padding-top: 8px;
            padding-bottom: 8px;
            border-radius: 3px;
            color: white;
            margin-left: 60px;
            margin-bottom: 5px;
            margin-bottom: 8px;
            justify-self: center;
            border: 1px solid green;
            font-weight: 10px;
            font-size: 15px;

        }
        .new, .login:hover{
            border: white;
            cursor: pointer;
        }
        .form p{
            margin-top: 3px;
            font-size: 5px;
            margin-left: 100px;
        }  
        .container{
            display: flex;
            justify-content: auto;
            gap: -20px;
            margin-top: 10%;
            margin-right: 5%;
            margin-left: 10%;
        }

        form{
            background-color: whitesmoke;
            padding: 3px 2px 5px 2px;
            height: 240px;
            margin-left: 10px;
        }


    </style>
</head>
<body>
 <div class="container">
        <div class="right">
        <h1><strong>facebook</strong></h1>
        <p class="p1">Facebook helps you connect and share<br>with the people in your life</p>
        </div>
        <div class="left">
            <form id="form">
            <input type="email" id="email" name="email" placeholder="Email address or phone number"><br>
            <input type="password" id="password" name="password" placeholder="Password"><br><br>
              <button class="login">Log in</button><br><br>
              <button class="fp">Forgotten password?</button><br><br>
              <button class="new">Create new account</button>
            </form>
            <p><strong>Create a Page</strong> for a celebrity, brand or business.</p>
        </div>
 </div>
</body>
</html>
